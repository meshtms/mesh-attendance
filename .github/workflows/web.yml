name: Deploy Web

# Builds the browser version and deploys it to Azure Static Web Apps.
# main goes to the production URL; any other branch gets its own preview URL
# (e.g. the tardy branch -> https://<app>-tardy.<region>.azurestaticapps.net).

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        env:
          # The web build doesn't need the Electron binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - run: npm run build:web

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist-web
          skip_app_build: true
          skip_api_build: true
          deployment_environment: ${{ github.ref_name != 'main' && github.ref_name || '' }}
